<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tray</title>
<!-- Open it from the Pi: http://<pi>:8000/display. The Pi sets a session cookie for /api/v1/stream;
     a copy opened from anywhere else can't read the stream. -->
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
         align-items: center; text-align: center; background: #222; color: #fff; transition: background .4s; }
  body.READY { background: #14632f; }
  body.MISSING { background: #9b1c1c; }
  body.IDLE { background: #2b2f36; }
  body.STALE { background: #8a5a00; }
  #state { font-size: min(22vw, 30vh); font-weight: 800; letter-spacing: .02em; line-height: 1; }
  #detail { font-size: min(7vw, 9vh); margin-top: 3vh; max-width: 90vw; }
  #next { font-size: min(4vw, 5vh); margin-top: 3vh; opacity: .85; }
  #conn { position: fixed; bottom: 1.5vh; right: 2vw; font-size: 2.2vh; opacity: .7; }
  #remind { font-size: min(4.5vw, 6vh); margin-top: 3vh; max-width: 90vw; }
  #wx { position: fixed; top: 1.5vh; left: 2vw; font-size: 2.4vh; opacity: .85; }
  #weather { position: fixed; top: 2vh; right: 2.5vw; display: flex; align-items: center; gap: 1.2vh; text-align: right; }
  #weather svg { width: 7vh; height: 7vh; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #weather .t { font-size: 5vh; font-weight: 700; line-height: 1; }
  #weather .d { font-size: 2.2vh; opacity: .85; margin-top: .4vh; }
  #wx b { border: 2px solid currentColor; border-radius: 6px; padding: .1em .4em; }
</style>
</head>
<body>
<div id="state" role="status" aria-live="polite">…</div>
<div id="detail"></div>
<div id="remind"></div>
<div id="next"></div>
<div id="wx"></div>
<div id="weather" aria-label="Weather"></div>
<div id="conn">Connecting…</div>
<script>
const $ = id => document.getElementById(id);
const time = iso => iso.slice(11, 16);
const TEXT = { READY: "Everything is on the tray", IDLE: "Nothing to bring today",
               STALE: "Calendar data is old (offline?)" };

function show(s) {
  document.body.className = s.state;
  $("state").textContent = s.state;
  const lost = [...s.missing, ...s.no_tag.map(n => n + " (no tag)")];
  const tmw = s.plan_for === "tomorrow";  // evening: the tray checks tomorrow's plan
  $("detail").textContent = lost.length ? (tmw ? "Tomorrow, missing: " : "Missing: ") + lost.join(", ")
    : tmw && s.state === "READY" ? "Tomorrow: ready"
    : tmw && s.state === "IDLE" ? "Nothing to bring tomorrow" : TEXT[s.state] || "";
  // weather suggestions not on the tray: a reminder, never "missing"
  const by = {};
  (s.reminders || []).forEach(r => (by[r.reason] = by[r.reason] || []).push(r.name));
  $("remind").textContent = Object.keys(by).length
    ? "Remember: " + Object.entries(by).map(([why, n]) => `${n.join(", ")} (${why})`).join("; ") : "";
  $("wx").innerHTML = "";
  if (s.weather_simulated) $("wx").append(Object.assign(document.createElement("b"), {textContent: "SIMULATED WEATHER: " + s.weather_simulated}));
  else if (s.weather_unavailable) $("wx").textContent = "Weather unavailable";
  const e = s.next_event;
  $("next").textContent = e ? `${e.title} · ${time(e.start)}–${time(e.end)}` : "";
}

// weather: from the page's own state (same origin), once a minute; never blocks the status above
const WICON = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.5 3.5 3.5 0 0 0 7 18z"/>',
  partly: '<circle cx="8" cy="8" r="2.6"/><path d="M8 2.5V4M2.5 8H4M4.1 4.1l1 1M11.9 4.1l-1 1"/><path d="M9.5 20h8a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 8.9 14 3 3 0 0 0 9.5 20z"/>',
  rain: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.5 3.5 3.5 0 0 0 7 15z"/><path d="M8.5 18l-1 3M12.5 18l-1 3M16.5 18l-1 3"/>',
  snow: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.5 3.5 3.5 0 0 0 7 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01M10 21.5h.01M14 18.5h.01"/>',
};
const r1 = x => x == null ? "–" : String(Math.round(x * 10) / 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
function sky(n, hour) {
  if (n.precipitation_probability >= 50 || n.precipitation >= 0.5) return n.temperature_2m <= 1 ? "snow" : "rain";
  if (n.cloud_cover >= 75) return "cloud";
  const day = hour >= 7 && hour < 18;
  return n.cloud_cover >= 30 ? (day ? "partly" : "cloud") : (day ? "sun" : "moon");
}
async function weather() {
  try {
    const st = await (await fetch("/api/state", {cache: "no-store"})).json(), w = st.weather || {}, n = w.now;
    const hour = new Date(st.now * 1000).getHours();
    $("weather").innerHTML = !n ? "" : `<div><div class="t">${r1(n.temperature_2m)}°</div>
      <div class="d">${esc(w.location && w.location.name)} · rain ${r1(n.precipitation_probability)}%</div></div>
      <svg viewBox="0 0 24 24" aria-hidden="true">${WICON[sky(n, hour)]}</svg>`;
  } catch (e) { /* keep the last one */ }
}
weather();
setInterval(weather, 60000);

const es = new EventSource("/api/v1/stream");  // reconnects by itself
es.onmessage = m => { show(JSON.parse(m.data)); $("conn").textContent = "Live"; };
es.onerror = () => { $("conn").textContent = "Reconnecting…"; };
</script>
</body>
</html>
