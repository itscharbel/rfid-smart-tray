<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a19" media="(prefers-color-scheme: dark)">
<title>Tray</title>
<style>
:root{
  color-scheme:light dark;
  --bg:oklch(1 0 0);
  --fill:oklch(0.965 0.006 180);
  --line:oklch(0.905 0.008 180);
  --field-line:oklch(0.64 0.012 180);  /* input edge: 3.3:1 on --bg (WCAG 1.4.11) */
  --ink:oklch(0.21 0.012 180);
  --ink-2:oklch(0.43 0.012 180);
  --ink-3:oklch(0.50 0.010 180);
  --teal:oklch(0.50 0.09 180);
  --teal-press:oklch(0.44 0.09 180);
  --on-teal:oklch(1 0 0);
  --miss:oklch(0.54 0.16 35);
  --on-miss:oklch(1 0 0);
  --miss-ink:oklch(0.42 0.13 35);
  --notag:oklch(0.62 0.12 75);
  --notag-ink:oklch(0.45 0.09 70);
  --band-idle:oklch(0.962 0.006 180);
  --band-ready:oklch(0.925 0.045 180);
  --band-miss:oklch(0.935 0.045 35);
  --band-ink-ready:oklch(0.30 0.06 180);
  --band-ink-miss:oklch(0.36 0.11 35);
  --stale-bg:oklch(0.90 0.10 85);
  --stale-ink:oklch(0.32 0.07 70);
  --z-nav:10;--z-backdrop:20;--z-sheet:30;--z-toast:40;
  --ease:cubic-bezier(.25,1,.5,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:oklch(0.185 0.008 180);
  --fill:oklch(0.235 0.010 180);
  --line:oklch(0.305 0.010 180);
  --field-line:oklch(0.52 0.012 180);
  --ink:oklch(0.95 0.006 180);
  --ink-2:oklch(0.76 0.010 180);
  --ink-3:oklch(0.68 0.010 180);
  --teal:oklch(0.74 0.10 180);
  --teal-press:oklch(0.80 0.09 180);
  --on-teal:oklch(0.18 0.02 180);
  --miss:oklch(0.72 0.15 35);
  --on-miss:oklch(0.18 0.03 35);
  --miss-ink:oklch(0.84 0.09 35);
  --notag:oklch(0.80 0.12 80);
  --notag-ink:oklch(0.86 0.09 80);
  --band-idle:oklch(0.225 0.010 180);
  --band-ready:oklch(0.285 0.050 180);
  --band-miss:oklch(0.290 0.060 35);
  --band-ink-ready:oklch(0.90 0.06 180);
  --band-ink-miss:oklch(0.90 0.07 35);
  --stale-bg:oklch(0.42 0.09 75);
  --stale-ink:oklch(0.97 0.03 85);
}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.col{max-width:560px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ambient band: the colour is the status, readable at a glance from across the hall */
.band{background:var(--band-idle);transition:background-color .45s var(--ease),color .45s var(--ease);
  padding:calc(10px + env(safe-area-inset-top)) 0 28px}
body[data-mood=ready] .band{background:var(--band-ready);color:var(--band-ink-ready)}
body[data-mood=miss] .band{background:var(--band-miss);color:var(--band-ink-miss)}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.mark{font-weight:650;font-size:17px;letter-spacing:-.01em}
.conn{font-size:13px;color:var(--ink-2)}
.demo{font-size:12px;font-weight:600;padding:2px 8px;border:1px solid currentColor;border-radius:6px;opacity:.75}
.gear{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:inherit;margin-right:-10px}
.gear:hover{background:color-mix(in oklch,currentColor 8%,transparent)}
.date{font-size:15px;margin:14px 0 6px;opacity:.85}
h1{font-size:30px;line-height:1.15;font-weight:650;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{font-size:16px;margin:10px 0 0;opacity:.9;text-wrap:pretty}
.warn{font-size:14px;margin:14px 0 0;display:flex;gap:8px;align-items:flex-start}
.sim{display:inline-block;margin:0 0 4px;padding:3px 8px;border:2px solid currentColor;border-radius:6px;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.warn.stale{background:var(--stale-bg);color:var(--stale-ink);padding:10px 12px;border-radius:10px;font-weight:550}
.band .btn{margin-top:18px}

/* sections */
/* the tab bar is sticky in the page flow, so the page always ends above it whatever its real height */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main.col{flex:1 0 auto;width:100%;padding-bottom:28px}
section.block{margin-top:28px}
h2{font-size:17px;font-weight:620;margin:0 0 4px;letter-spacing:-.005em}
.hint{font-size:14px;color:var(--ink-2);margin:6px 0 0;text-wrap:pretty}
.list{list-style:none;margin:8px 0 0;padding:0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 0;text-align:left;
  border-bottom:1px solid var(--line);transition:background-color .2s var(--ease)}
.list>li:last-child>.row,.list>.row:last-child{border-bottom:0}
button.row:hover{background:color-mix(in oklch,var(--ink) 3%,transparent)}
.row .main{flex:1;min-width:0}
.row .name{font-size:17px;font-weight:520;overflow-wrap:anywhere}
.row .meta{font-size:14px;color:var(--ink-2)}
.row .state{font-size:14px;color:var(--ink-2);white-space:nowrap}
.row .state.miss{color:var(--miss-ink)}.row .state.notag{color:var(--notag-ink)}.row .state.ok{color:var(--ink-2)}
.chev{color:var(--ink-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink-2)}

/* item state marks */
.dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.dot.ok{background:var(--teal);color:var(--on-teal)}
.dot.ok svg{width:14px;height:14px;stroke-width:2.4}
.dot.missing{border:2px solid var(--miss)}
.dot.unknown{border:2px dashed var(--notag)}
.dot.extra{border:2px solid var(--line);background:var(--fill)}
.dot.new{border:2px dashed var(--ink-3)}

.link{color:var(--teal);font-weight:600;font-size:15px;min-height:44px;padding:0 2px}
@media (prefers-color-scheme:light){.link{color:oklch(0.42 0.08 180)}}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.ev .link{margin:-12px -2px -12px 0}  /* keeps the 44px tap target without pushing the row apart */

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;
  font-weight:600;font-size:16px;background:var(--fill);color:var(--ink);border:1px solid var(--line);
  transition:background-color .15s var(--ease),transform .15s var(--ease),opacity .15s}
.btn:hover{background:color-mix(in oklch,var(--fill) 70%,var(--line))}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--teal);color:var(--on-teal);border-color:transparent}
.btn.primary:hover{background:var(--teal-press)}
.btn.danger{color:var(--miss-ink);background:transparent}
.btn.danger.armed{background:var(--miss);color:var(--on-miss);border-color:transparent}
.btn.wide{width:100%}
.field{display:flex;gap:8px;margin-top:10px}
label.lbl{display:block;font-size:14px;font-weight:550;color:var(--ink-2);margin:16px 0 6px}
input[type=text],input[type=url],input[type=number],input[type=datetime-local],select{flex:1;min-width:0;width:100%;min-height:48px;padding:0 14px;border-radius:12px;
  border:1px solid var(--field-line);background:var(--bg);font-size:16px;transition:border-color .15s}
input::placeholder{color:var(--ink-3)}
fieldset.rule{border:1px solid var(--line);border-radius:12px;padding:2px 12px 12px;margin:12px 0 0}
.wx{margin-top:10px}
.wtop{display:flex;align-items:center;gap:14px;margin-top:8px}
svg.wbig{width:60px;height:60px;stroke-width:1.4}
.wtop h1{font-size:46px;line-height:1}
.wtop .sub{margin:4px 0 0}
.wmetrics{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:15px}
.wmetrics li{display:flex;align-items:center;gap:8px}
.wplan{font-size:15px}
.wplace{display:inline-flex;align-items:center;gap:3px;padding:0;border:0;background:none;color:inherit;font:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.wplace svg.i{width:16px;height:16px}
.row .when{flex:none;width:44px;font-size:14px;line-height:1.35;color:var(--ink-2)}
.pill{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;vertical-align:2px}
.pill.ok{background:var(--band-ready);color:var(--band-ink-ready)}
.pill.miss{background:var(--band-miss);color:var(--band-ink-miss)}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in oklch,var(--teal) 22%,transparent)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{font-size:14px;padding:6px 12px;min-height:36px;border:1px solid var(--line);border-radius:8px;color:var(--ink-2)}
.quick button:hover{color:var(--ink);border-color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}


/* history */
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--ink-3);font-size:14px}
.hist .alert{color:var(--miss-ink)}

/* bottom navigation */
nav.tabs{position:sticky;bottom:0;z-index:var(--z-nav);background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;
  font-weight:550;color:var(--ink-3);position:relative;transition:color .15s}
nav.tabs button[aria-selected=true]{color:var(--ink)}
nav.tabs button[aria-selected=true] svg{color:var(--teal)}
.badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--miss);color:var(--on-miss);font-size:11px;font-weight:650;display:grid;place-items:center}

/* bottom sheet */
.backdrop{position:fixed;inset:0;z-index:var(--z-backdrop);background:oklch(0.15 0.01 180 / .4);opacity:0;pointer-events:none;
  transition:opacity .24s var(--ease)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sheet);margin:0 auto;max-width:560px;max-height:88vh;overflow:auto;
  background:var(--bg);border-radius:16px 16px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s var(--ease);box-shadow:0 -1px 0 var(--line)}
.open .backdrop{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sheet .lead{font-size:15px;color:var(--ink-2);margin:4px 0 0}
.xbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-3);margin-right:-10px}
.xbtn:hover{color:var(--miss-ink);background:var(--fill)}
.kw{display:flex;gap:8px;align-items:center}.kw input{max-width:140px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:15px;min-height:44px;margin:-6px 0 2px -4px}
.back svg{transform:rotate(180deg)}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:var(--z-toast);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:15px;max-width:520px;
  transition:opacity .3s var(--ease),transform .3s var(--ease);animation:in .24s var(--ease)}
.toast.err{background:var(--miss);color:var(--on-miss)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-mood="idle">
<header class="band">
  <div class="col">
    <div class="bar">
      <span class="mark">Tray</span>
      <span class="demo" id="demoTag" hidden>Sample data</span>
      <span class="conn" id="conn"></span>
      <button class="gear" data-act="settings" aria-label="Settings">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div id="status"></div>
    <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
  </div>
</header>

<main class="col">
  <section id="tab-tray" role="tabpanel">
    <div id="hero"></div>
    <div id="tray"></div>
    <div id="upcoming"></div>
  </section>
  <section id="tab-tags" role="tabpanel" hidden>
    <div id="tagsList"></div>
  </section>
  <section id="tab-log" role="tabpanel" hidden>
    <section class="block"><h2>History</h2><div id="log"></div></section>
  </section>
</main>

<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-act="tab" data-tab="tray" aria-selected="true">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5.5 5h13l2.5 8v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>Today</button>
  <button role="tab" data-act="tab" data-tab="tags" aria-selected="false">
    <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Things
    <span class="badge" id="badge" hidden></span></button>
  <button role="tab" data-act="tab" data-tab="log" aria-selected="false">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
</div></nav>

<div id="sheetWrap">
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';

/* ================= adapter: the ONLY place that knows the backend's JSON shapes ================= */
function normalize(raw) {
  const status = l => l.map(i => ({name: i.name, state: i.status}));
  const event = e => ({
    key: e.key, title: e.title, start: e.start_ts * 1000, end: (e.end_ts || e.start_ts) * 1000, whenText: e.when, checkAt: e.check,
    items: status(e.items), override: e.override, presets: e.presets, bring: e.bring, keyword: e.keyword,
  });
  const events = (raw.events || []).map(event);
  const day = (raw.day || []).map(event);  // all of today's events, ongoing and past ones too
  const t = raw.today;
  return {
    onTray: raw.on_tray.map(x => ({uid: x.uid, name: x.name || ''})),
    names: raw.names,
    tags: raw.tags.map(x => ({uid: x.uid, name: x.name})),
    unnamed: raw.unnamed.map(u => ({uid: u.uid, seen: u.seen})),
    calendar: {state: raw.cal.state, updated: raw.cal.updated, stale: raw.stale,
               from: raw.calendar_updated && raw.calendar_updated.slice(11, 16), age: raw.age_minutes},
    events,
    day,
    today: t && {items: status(t.items), checkAt: t.check, events: day.filter(e => t.keys.includes(e.key))},
    notify: {on: raw.ntfy.set, hint: raw.ntfy.last4},
    ics: {on: raw.ics.set, hint: raw.ics.last4},
    lead: raw.lead,
    planFor: raw.plan_for || 'today',
    tomorrow: raw.tomorrow && {items: status(raw.tomorrow.items), events: events.filter(e => raw.tomorrow.keys.includes(e.key))},
    bag: raw.bag || null,
    simulated: raw.simulated || null,
    weather: {override: 'none', simulated: null, note: null, today: [], tomorrow: null, location: null, now: null, range: null, ...raw.weather},
    skew: raw.simulated ? raw.now * 1000 - Date.now() : 0,  // follow the tray's simulated clock
    log: raw.log.map(l => {
      const m = /^(\d{2}\/\d{2}) (\d{2}:\d{2}):\d{2} (.*)$/.exec(l);
      return m ? {day: m[1], time: m[2], text: m[3]} : {day: '', time: '', text: l};
    }),
  };
}
const normalizePresets = raw => raw.presets.map(p => ({name: p.name, aliases: p.aliases, items: p.items}));
const API = {
  state: () => req('GET', '/api/state'),
  nameTag: (uid, name) => req('POST', '/api/name', {uid, name}),
  deleteTag: uid => req('POST', '/api/delete', {uid}),
  setBag: uid => req('POST', '/api/bag', {uid}),   // uid '' = no bag
  saveLocation: (latitude, longitude, location_name) => req('POST', '/api/settings', {latitude, longitude, location_name}),
  geocode: q => req('GET', '/api/geocode?q=' + encodeURIComponent(q)),
  saveSettings: (ntfy_topic, ics_url, lead_minutes, weather_override) => req('POST', '/api/settings', {ntfy_topic, ics_url, lead_minutes, weather_override}),
  rules: () => req('GET', '/api/rules'),
  demoTime: fake_now => req('POST', '/api/demo_time', {fake_now}),   // '' = back to real time
  saveRules: rules => req('POST', '/api/rules', {rules}),
  testNotify: () => req('POST', '/api/test_notify', {}),
  eventItems: (key, items, scope, preset) => req('POST', '/api/event_items', {key, items, scope, preset}),
  presets: () => req('GET', '/api/presets').then(normalizePresets),
  savePreset: (p, oldName) => req('POST', '/api/presets', {name: p.name, aliases: p.aliases, items: p.items, old_name: oldName}),
  deletePreset: name => req('DELETE', '/api/presets', {name}),
};
/* =============================================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const QUICK = ['keys', 'wallet', 'bottle', 'phone', 'pc'];
const ICON = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  chev: '<svg class="i chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 16.5v.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
};
const STATE_WORD = {ok: 'On the tray', missing: 'Not on the tray', unknown: 'No tag yet'};
const STATE_CLS = {ok: 'ok', missing: 'miss', unknown: 'notag'};
const dot = state => `<span class="dot ${state}" aria-hidden="true">${state === 'ok' ? ICON.check : ''}</span>`;
const joinWords = l => l.length < 2 ? l.join('') : l.slice(0, -1).join(', ') + ' and ' + l[l.length - 1];

let M = null, demo = false, everOnline = false, online = false, tab = 'tray';
let lastSaid = null;   // last headline announced to screen readers (null = first render, stay quiet)
let draft = null;   // list being edited in a sheet: {kind: 'event'|'preset', items: [], ...}

/* ---------- transport (real backend or demo) ---------- */
async function req(method, path, body) {
  if (demo) return Demo.handle(method, path, body);
  const r = await fetch(path, {method, cache: 'no-store',
    headers: body ? {'Content-Type': 'application/json'} : {}, body: body && JSON.stringify(body)});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function act(promise, okMsg) {
  try { const r = await promise; if (okMsg) toast(okMsg); poll(); return r; }
  catch (e) { toast('Can’t reach the tray. Try again.', true); }
}

async function poll() {
  try {
    M = normalize(await API.state());
    everOnline = everOnline || !demo; online = true;
  } catch (e) {
    if (!everOnline && !demo) {   // page opened as a file / no backend: preview with fake data
      demo = true; $('demoTag').hidden = false;
      toast('No tray found, showing sample data');
      return poll();
    }
    online = false;
  }
  render();
}

/* ---------- rendering ---------- */
const prev = {};
function put(id, html) {               // re-render only on change, never under a focused input
  const el = $(id), a = document.activeElement;
  if (!el || prev[id] === html) return;
  const inside = a && el.contains(a);
  if (inside && a.matches('input')) return;
  const was = inside ? describe(a) : null;
  prev[id] = html; el.innerHTML = html;
  if (was) find(was, el)?.focus({preventScroll: true});   // polling must not drop a keyboard user's place
}

/* identify a control by what it does, so it can be found again after its markup is replaced */
function describe(el) {
  if (!el || el === document.body || !el.dataset) return null;
  const {act, key, uid, tab, name, i} = el.dataset;
  return act ? {el, act, key, uid, tab, name, i} : {el};
}
function find(d, root = document) {
  if (d.el.isConnected && !d.el.closest('[inert]')) return d.el;
  if (!d.act) return null;
  const sel = `[data-act="${CSS.escape(d.act)}"]` + ['key', 'uid', 'tab', 'name', 'i']
    .filter(k => d[k] !== undefined).map(k => `[data-${k}="${CSS.escape(d[k])}"]`).join('');
  return [...root.querySelectorAll(sel)].find(n => !n.closest('[inert]')) || null;
}

const nowMs = () => Date.now() + (M ? M.skew : 0);  // the tray's clock, simulated or not
function relTime(ms) {
  const min = Math.round((ms - nowMs()) / 6e4);
  if (min <= 0) return 'now';
  if (min < 60) return 'in ' + min + ' min';
  if (min < 12 * 60) return 'in ' + Math.floor(min / 60) + ' h' + (min % 60 ? ' ' + (min % 60) + ' min' : '');
  const day0 = x => new Date(x).setHours(0, 0, 0, 0);
  const days = Math.round((day0(ms) - day0(nowMs())) / 864e5);
  return days === 0 ? 'today at ' + hhmm(ms) : days === 1 ? 'tomorrow at ' + hhmm(ms) : 'in ' + days + ' days';
}
const hhmm = ms => new Date(ms).toTimeString().slice(0, 5);

/* the plan the UI focuses on: in the evening tomorrow's plan; else everything still needed today, else the next event */
function focus() {
  if (M.planFor === 'tomorrow') return M.tomorrow && M.tomorrow.events.length
    ? {items: M.tomorrow.items, events: M.tomorrow.events, checkAt: null, tomorrow: true} : null;
  if (M.today) return {items: M.today.items, events: M.today.events, checkAt: M.today.checkAt};
  const e = M.events[0];
  return e && {items: e.items, events: [e], checkAt: e.checkAt};
}
const eventsFor = (f, name) => f.events.filter(e => e.items.some(i => i.name.toLowerCase() === name.toLowerCase()));
/* weather icons, same line style as the other icons */
const WICON = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.5 3.5 3.5 0 0 0 7 18z"/>',
  partly: '<circle cx="8" cy="8" r="2.6"/><path d="M8 2.5V4M2.5 8H4M4.1 4.1l1 1M11.9 4.1l-1 1"/><path d="M9.5 20h8a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 8.9 14 3 3 0 0 0 9.5 20z"/>',
  rain: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.5 3.5 3.5 0 0 0 7 15z"/><path d="M8.5 18l-1 3M12.5 18l-1 3M16.5 18l-1 3"/>',
  snow: '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.5 3.5 3.5 0 0 0 7 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01M10 21.5h.01M14 18.5h.01"/>',
  temp: '<path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
};
const wsvg = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${WICON[k]}</svg>`;
const r1 = x => x == null ? '–' : String(Math.round(x * 10) / 10);
function sky(n) {   // -> [icon, word] for this hour
  const cold = n.temperature_2m <= 1;
  if (n.precipitation_probability >= 50 || n.precipitation >= 0.5) return cold ? ['snow', 'Snow likely'] : ['rain', 'Rain likely'];
  if (n.cloud_cover >= 75) return ['cloud', 'Cloudy'];
  const h = new Date(nowMs()).getHours(), day = h >= 7 && h < 18;
  if (n.cloud_cover >= 30) return [day ? 'partly' : 'cloud', 'Partly cloudy'];
  return day ? ['sun', 'Sunny'] : ['moon', 'Clear'];
}

/* the band: date, location and the weather now (what to bring is right below, under "Today") */
function statusHtml() {
  const c = M.calendar, w = M.weather, loc = w.location, g = w.range;
  const date = new Date(nowMs()).toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
  const sim = (M.simulated ? `<p class="sim">Simulated time · ${esc(hhmm(nowMs()))}</p> ` : '')
    + (w.simulated ? `<p class="sim">Simulated weather: ${esc(w.simulated)}</p>` : '');
  const ago = m => m < 60 ? `${m} min` : `${(m / 60).toFixed(m < 600 ? 1 : 0)} h`;
  const warn = c.state === 'unconfigured'
    ? `<p class="warn">${ICON.warn}<span>Connect your calendar so the tray knows what your day needs.</span></p><button class="btn primary" data-act="settings">Connect calendar</button>`
    : c.stale ? `<p class="warn stale">${ICON.warn}<span>${c.from ? `Offline: showing calendar from ${esc(c.from)} (${ago(c.age)} ago)` : 'Offline: no calendar data yet'}</span></p>`
    : c.state === 'invalid' ? `<p class="warn">${ICON.warn}<span>The saved calendar link doesn’t look like an iCal feed.</span></p>` : '';
  const place = loc ? (loc.name || `${r1(loc.latitude)}, ${r1(loc.longitude)}`) : 'Set location';
  const placeBtn = `<button class="wplace" data-act="location" aria-label="Location: ${esc(place)}. Change">${wsvg('pin')}${esc(place)}</button>`;
  const f = focus(), notOk = f ? f.items.filter(i => i.state !== 'ok').length : 0;
  document.body.dataset.mood = !f || !f.items.length ? 'idle' : notOk ? 'miss' : 'ready';
  let body;
  if (w.override === 'off') body = '<h1>Weather off</h1><p class="sub">Weather suggestions are switched off.</p>';
  else if (!w.now) body = '<h1>Weather unavailable</h1><p class="sub">The tray keeps working; suggestions come back with the next forecast.</p>';
  else {
    const n = w.now, [k, word] = sky(n);
    body = `<div class="wtop">${wsvg(k, 'i wbig')}<div><h1>${r1(n.temperature_2m)}°</h1><p class="sub">${word}</p></div></div>
      <ul class="wmetrics">
        <li>${wsvg('temp')}Feels like ${r1(n.apparent_temperature)}°</li>
        <li>${wsvg('drop')}Rain ${r1(n.precipitation_probability)}%</li>
        <li>${wsvg('cloud')}Clouds ${r1(n.cloud_cover)}%</li>
        <li>${wsvg('sun')}UV ${r1(n.uv_index)}</li></ul>
      ${g ? `<p class="sub wplan">${M.planFor === 'tomorrow' ? 'Tomorrow' : 'During your plan'}, ${esc(g.from)}–${esc(g.to)}:
        ${r1(g.min_temperature_2m)}–${r1(g.max_temperature_2m)}°, rain up to ${r1(g.max_precipitation_probability)}%, UV up to ${r1(g.max_uv_index)}</p>` : ''}`;
  }
  return `${sim}<p class="date">${date} · ${placeBtn}</p>${body}${warn}`;
}

function heroHtml() {
  const f = focus(), c = M.calendar, title = M.planFor === 'tomorrow' ? 'Tomorrow' : 'Today';
  if (!f || !f.items.length) {
    const msg = c.state === 'unconfigured' ? 'Connect your calendar to see what to bring.'
      : f ? 'Nothing to bring.'
      : c.state === 'loading' ? 'Reading your calendar…'
      : M.planFor === 'tomorrow' ? 'Nothing planned tomorrow.'
      : c.state === 'ok' || c.stale ? 'Nothing planned: no events in the next seven days.'
      : 'Calendar unreachable: retrying every minute. The tray keeps working meanwhile.';
    return `<section class="block"><h2>${title}</h2><p class="hint">${msg}</p></section>`;
  }
  const notOk = f.items.filter(i => i.state !== 'ok').length;
  const pill = notOk ? `<span class="pill miss">${notOk} missing</span>` : '<span class="pill ok">Ready</span>';
  const when = f.tomorrow || M.today ? f.events.map(e => `${esc(e.title)} ${hhmm(e.start)}`).join(' · ')
    : `${esc(f.events[0].title)}, ${relTime(f.events[0].start)}`;
  const many = f.events.length > 1;
  const rows = f.items.map(i => {
    const evs = eventsFor(f, i.name), e = evs[0] || f.events[0];
    return `<li><button class="row" data-act="editList" data-key="${esc(e.key)}">${dot(i.state)}
      <span class="main"><span class="name">${esc(i.name)}</span>${many ? `<br><span class="meta">${evs.map(x => esc(x.title)).join(' + ')}</span>` : ''}</span>
      <span class="state ${STATE_CLS[i.state]}">${STATE_WORD[i.state]}</span></button></li>`;
  }).join('');
  const remind = M.notify.on ? '' : `<p class="hint">Reminders are off. <button class="link" data-act="settings">Turn them on</button></p>`;
  return `<section class="block"><h2>${title} ${pill}</h2><p class="hint" style="margin:0 0 4px">${when}</p>
    <ul class="list">${rows}</ul>${weatherHtml(f)}${remind}</section>`;
}

/* weather items: suggestions with their reason, never "missing" */
function weatherHtml(f) {
  const w = M.weather, items = (f.tomorrow ? w.tomorrow : w.today) || [];
  if (w.note === 'unavailable') return '<p class="hint wx">Weather unavailable: no weather items.</p>';
  if (!items.length) return '';
  const by = {};
  items.forEach(i => (by[i.reason] = by[i.reason] || []).push(i));
  return '<div class="wx">' + Object.entries(by).map(([why, l]) => `<p class="hint"><strong>Remember:</strong> ${
    joinWords(l.map(i => esc(i.name) + (i.on_tray ? ' (on the tray)' : '')))}: ${esc(why)}</p>`).join('') + '</div>';
}

/* the next days' events (today's, or tomorrow's in the evening, are already under Today) */
function upcomingHtml() {
  const f = focus(), skip = new Set([...M.day, ...(f ? f.events : [])].map(e => e.key));
  const rest = M.events.filter(e => !skip.has(e.key));
  if (!rest.length) return '';
  return `<section class="block"><h2>Coming up</h2><ul class="list">${rest.map(e => {
    const [d, , t] = e.whenText.split(' ');
    return `<li><button class="row" data-act="editList" data-key="${esc(e.key)}"><span class="when">${esc(d)}<br>${esc(t)}</span>
      <span class="main"><span class="name">${esc(e.title)}</span><br><span class="meta">${
        e.items.length ? e.items.map(i => esc(i.name)).join(', ') : 'Nothing to bring'}</span></span>${ICON.chev}</button></li>`;
  }).join('')}</ul></section>`;
}

function trayHtml() {
  const f = focus(), need = new Set((f ? f.items : []).map(i => i.name.toLowerCase()));
  const rows = M.onTray.map(t => t.name
    ? `<li><button class="row" data-act="tag" data-uid="${esc(t.uid)}">${dot(need.has(t.name.toLowerCase()) ? 'ok' : 'extra')}
        <span class="main"><span class="name">${esc(t.name)}</span></span>
        <span class="state">${need.has(t.name.toLowerCase()) ? 'Needed' : 'Not needed'}</span>${ICON.chev}</button></li>`
    : `<li><button class="row" data-act="nameNew" data-uid="${esc(t.uid)}">${dot('new')}
        <span class="main"><span class="name">Something new</span><br><span class="mono">${esc(t.uid)}</span></span>
        <span class="state link">Name it</span></button></li>`).join('');
  return `<section class="block"><h2>On the tray now</h2>
    ${rows ? `<ul class="list">${rows}</ul>` : '<p class="hint">Nothing on the tray right now.</p>'}
    <p class="hint">Put things anywhere on it; only what’s there counts.</p></section>`;
}

function nameBox(uid, autofocus) {
  return `<div class="field"><input type="text" maxlength="30" placeholder="What is it?" aria-label="Name" data-uid="${esc(uid)}"
      enterkeyhint="done" autocomplete="off"${autofocus ? ' data-autofocus' : ''}>
    <button class="btn primary" data-act="saveName" data-uid="${esc(uid)}">Save</button></div>
    <div class="quick">${QUICK.map(q => `<button data-act="fill" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
}

function tagsHtml() {
  const un = M.unnamed.length ? `<section class="block"><h2>New on the tray</h2>
    <p class="hint">The tray noticed something it doesn’t know yet. Give it a name.</p>
    ${M.unnamed.map(u => `<div class="namebox" style="padding:14px 0;border-bottom:1px solid var(--line)">
      <div class="mono">${esc(u.uid)} · first seen ${esc(u.seen)}</div>${nameBox(u.uid)}</div>`).join('')}</section>` : '';
  const reg = M.tags.length ? `<ul class="list">${M.tags.map(t => `<li><button class="row" data-act="tag" data-uid="${esc(t.uid)}">
      <span class="main"><span class="name">${esc(t.name)}</span><br><span class="mono">${esc(t.uid)}</span></span>${M.bag === t.uid ? '<span class="state">Bag</span>' : ''}${ICON.chev}</button></li>`).join('')}</ul>`
    : '<p class="hint">Nothing yet. Put something with a tag on the tray and it will show up here.</p>';
  return un + `<section class="block"><h2>Your things</h2>${reg}</section>`;
}

function logHtml() {
  if (!M.log.length) return '<p class="hint">Nothing has happened yet.</p>';
  return '<ul class="hist">' + M.log.map(l => {
    const alert = /^NOTIFY|failed|unreachable|invalid/.test(l.text);
    return `<li><time>${esc(l.day)} ${esc(l.time)}</time><span class="${alert ? 'alert' : ''}">${esc(l.text.replace(/^NOTIFY: /, 'Reminder sent: '))}</span></li>`;
  }).join('') + '</ul>';
}

function render() {
  $('conn').textContent = M && !online && !demo ? 'Offline · last known state' : '';
  if (!M) return;
  put('status', statusHtml());
  put('hero', heroHtml());
  const said = $('hero').querySelector('h2')?.textContent || '';   // "Today 2 missing" / "Today Ready"
  if (said !== lastSaid) { if (lastSaid !== null) $('announce').textContent = said; lastSaid = said; }
  put('tray', trayHtml());
  put('upcoming', upcomingHtml());
  put('tagsList', tagsHtml());
  put('log', logHtml());
  put('cfgStatus', cfgStatusHtml());
  const b = $('badge');
  b.hidden = !M.unnamed.length; b.textContent = M.unnamed.length;
}

/* ---------- sheets & toasts ---------- */
/* bottom sheet: modal while open (page behind is inert), fully inert while closed, focus goes in and comes back */
let opener = null;
const sheetEl = () => document.querySelector('.sheet');
const pageParts = () => document.querySelectorAll('header.band, main, nav.tabs');
function openSheet(html) {
  if (!document.body.classList.contains('open')) opener = describe(document.activeElement);
  $('sheetBody').innerHTML = html; delete prev.cfgStatus;
  const h = $('sheetBody').querySelector('h3');
  if (h) { h.id = 'sheetTitle'; h.tabIndex = -1; }
  sheetEl().inert = false;
  pageParts().forEach(p => p.inert = true);
  document.body.classList.add('open');
  if (M) put('cfgStatus', cfgStatusHtml());
  ($('sheetBody').querySelector('input[data-autofocus]') || h || sheetEl()).focus({preventScroll: true});
}
function closeSheet() {
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open');
  sheetEl().inert = true;
  pageParts().forEach(p => p.inert = false);
  const back = (opener && find(opener)) || document.querySelector(`nav [data-tab="${tab}"]`);
  opener = null;
  back?.focus({preventScroll: true});
}

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2600);
}

function nameSheet(uid, title) {
  openSheet(`<h3>${esc(title)}</h3><p class="lead mono">${esc(uid)}</p><div class="namebox">${nameBox(uid, true)}</div>`);
}
function tagSheet(uid) {
  const t = M.tags.find(x => x.uid === uid);
  if (!t) return;
  openSheet(`<h3>${esc(t.name)}</h3><p class="lead mono">${esc(uid)}</p>
    <label class="lbl" for="rename">Name</label>
    <div class="field" style="margin-top:0"><input type="text" id="rename" maxlength="30" value="${esc(t.name)}" data-uid="${esc(uid)}" enterkeyhint="done">
    <button class="btn primary" data-act="saveName" data-uid="${esc(uid)}">Rename</button></div>
    <div class="stack">${M.bag === uid
      ? `<button class="btn" data-act="bag" data-uid="">This isn’t my bag</button>`
      : `<button class="btn" data-act="bag" data-uid="${esc(uid)}">This is my bag</button>`}
      <button class="btn danger" data-act="del" data-uid="${esc(uid)}">Forget this thing</button></div>
    <p class="hint">In the evening, putting your bag on the tray checks what you need tomorrow.
      If you forget a thing, the tray will ask for its name again next time it sees it.</p>`);
}
function cfgStatusHtml() {
  if (!M) return '';
  const row = (name, meta, on) => `<div class="row"><span class="main"><span class="name">${name}</span><br><span class="meta">${meta}</span></span>
    <span class="state ${on ? '' : 'notag'}">${on ? 'Set' : 'Not set'}</span></div>`;

    + row('Reminders', M.notify.on ? 'ntfy topic ending in “' + esc(M.notify.hint) + '”' : 'Add an ntfy topic to get reminders', M.notify.on)
    + row('Calendar', M.ics.on ? 'Link ending in “' + esc(M.ics.hint) + '”' : 'Add your secret iCal link', M.ics.on)
    + row('Lead time', M.lead + ' minutes before each event', true) + '</div>';
}
function settingsSheet() {
  openSheet(`<h3>Settings</h3><div id="cfgStatus"></div>
    <button class="row" data-act="lists" style="border-top:1px solid var(--line)"><span class="main"><span class="name">Lists</span><br>
      <span class="meta">What to bring for each kind of event</span></span>${ICON.chev}</button>
    <button class="row" data-act="location"><span class="main"><span class="name">Location</span><br>

/* ---------- list editing (event lists and presets share the draft) ---------- */
const known = n => M.names.some(x => x.toLowerCase() === n.toLowerCase());
function draftHtml() {
  return draft.items.length ? '<ul class="list">' + draft.items.map((n, i) => `<li class="row">${known(n) ? '' : dot('unknown')}
      <span class="main"><span class="name">${esc(n)}</span>${known(n) ? '' : '<br><span class="meta">No tag yet</span>'}</span>
      <button class="xbtn" data-act="rmItem" data-i="${i}" aria-label="Remove ${esc(n)}">${ICON.x}</button></li>`).join('') + '</ul>'
    : '<p class="hint">Nothing on this list.</p>';
}
const renderDraft = () => { $('draftChips').innerHTML = draftHtml(); };
const adder = () => `<datalist id="tagNames">${M.names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
  <div class="field"><input type="text" id="addItem" list="tagNames" maxlength="30" placeholder="Add something" aria-label="Add something"
    enterkeyhint="enter" autocomplete="off"><button class="btn" data-act="addItem">Add</button></div>`;

function editListSheet(key) {
  const e = M.events.find(x => x.key === key) || M.day.find(x => x.key === key);
  if (!e) return toast('That event is no longer in your calendar', true);
  draft = {kind: 'event', key, items: e.items.map(i => i.name)};

/* ---------- demo mode: fake backend with the real JSON shapes ---------- */
const Demo = (() => {
  const G = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const p2 = n => String(n).padStart(2, '0');
  const fmt = (ms, day = true) => { const d = new Date(ms);
    return (day ? G[(d.getDay() + 6) % 7] + ` ${p2(d.getDate())}/${p2(d.getMonth() + 1)} ` : '') + `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const stamp = () => { const d = new Date(); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)} ${fmt(Date.now(), false)}:${p2(d.getSeconds())}`; };
  const at = (h, m = 0, plusDays = 0) => { const d = new Date(); d.setDate(d.getDate() + plusDays); d.setHours(h, m, 0, 0); return d.getTime(); };
  const late = new Date().getHours() >= 20;   // keep today's demo events in the future
  const s = {
    tags: {'33:46:64:F5': 'keys', '2E:97:29:03': 'pc', 'A1:B2:C3:D4': 'bottle', '77:10:9A:0E': 'towel'},
    on: {R1: '33:46:64:F5', R2: 'A1:B2:C3:D4', R3: '9F:00:12:7A'},
    unnamed: {'9F:00:12:7A': {seen: '27/10 18:42'}},
    presets: {gym: {aliases: ['sport'], items: ['bottle', 'towel']}, work: {aliases: [], items: ['pc', 'bottle']}},
    overrides: {},
    rules: [{name: 'rain', condition: 'precipitation_probability >= 50 or precipitation >= 0.5', items: ['umbrella']},
      {name: 'cold', condition: 'temperature_2m <= 5', items: ['scarf', 'gloves']}],
    events: [
      {key: 'coffee|1', title: 'Coffee with Anna', start: Math.min(at(7, 30), Date.now() - 6e4), bring: ['keys']},
      {key: 'work|1', title: 'Work', start: late ? Date.now() + 20 * 6e4 : Math.max(at(9), Date.now() + 20 * 6e4), bring: []},
      {key: 'gym|1', title: 'Gym', start: late ? Date.now() + 90 * 6e4 : Math.max(at(19), Date.now() + 3 * 36e5), bring: ['keys']},
      {key: 'dinner|1', title: 'Dinner with Marco', start: at(20, 30, 1), bring: ['wallet']},
      {key: 'run|1', title: 'Short run', start: at(19, 0, 2), bring: []},
    ],
    log: ['Calendar: ok', 'On tray: unnamed tag 9F:00:12:7A', 'On tray: bottle', 'NOTIFY: New tag detected (UID 9F:00:12:7A)', 'On tray: keys']
      .map(m => stamp() + ' ' + m),
  };
  const log = m => s.log.unshift(stamp() + ' ' + m);
  const wordIn = (w, t) => new RegExp('(^|[^\\p{L}\\p{N}_])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^\\p{L}\\p{N}_])', 'iu').test(t);
  const matching = t => Object.entries(s.presets).filter(([n, p]) => [n, ...p.aliases].some(w => wordIn(w, t))).map(([n]) => n);
  const findPreset = w => Object.keys(s.presets).find(n => n.toLowerCase() === w.toLowerCase()
    || s.presets[n].aliases.some(a => a.toLowerCase() === w.toLowerCase()));
  const dedupe = l => l.filter((x, i) => l.findIndex(y => y.toLowerCase() === x.toLowerCase()) === i);
  const resolve = e => s.overrides[e.key] || dedupe([...matching(e.title).flatMap(n => s.presets[n].items), ...e.bring]);
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const state = () => {
    const onTray = new Set(Object.values(s.on).map(u => (s.tags[u] || '').toLowerCase()));
    const names = new Set(Object.values(s.tags).map(n => n.toLowerCase()));
    const status = l => l.map(n => ({name: n, status: onTray.has(n.toLowerCase()) ? 'ok' : names.has(n.toLowerCase()) ? 'missing' : 'unknown'}));
    const upcoming = s.events.filter(e => e.start > Date.now());
    const today = s.events.filter(e => e.start + 36e5 > Date.now() && sameDay(e.start, Date.now()) && resolve(e).length)
      .sort((a, b) => a.start - b.start);
    const first = s.events.filter(e => sameDay(e.start, Date.now()) && resolve(e).length).sort((a, b) => a.start - b.start)[0];
    const firstCheck = first && first.start - 15 * 6e4;  // one reminder a day, before the first event
    const view = e => {
      const ov = s.overrides[e.key], ps = ov ? [] : matching(e.title);
      return {key: e.key, title: e.title, start_ts: Math.floor(e.start / 1000), end_ts: Math.floor(e.start / 1000) + 3600, when: fmt(e.start),
        check: fmt(e.start - 15 * 6e4, false), override: !!ov, presets: ps, bring: e.bring,
        keyword: ps[0] || (e.title.toLowerCase().match(/[\p{L}\p{N}_]{3,}/u) || [''])[0], items: status(resolve(e))};
    };
    const events = upcoming.map(view);
    return {
      on_tray: Object.values(s.on).map(uid => ({uid, name: s.tags[uid] || null})),
      names: [...new Set(Object.values(s.tags))].sort(),
      tags: Object.entries(s.tags).map(([uid, name]) => ({uid, name})),
      unnamed: Object.entries(s.unnamed).map(([uid, i]) => ({uid, ...i})),
      today: today.length ? {keys: today.map(e => e.key), items: status(dedupe(today.flatMap(resolve))),
        check: firstCheck > Date.now() ? fmt(firstCheck, false) : null} : null,
      day: s.events.filter(e => sameDay(e.start, Date.now())).sort((a, b) => a.start - b.start).map(view),
      events, next: events[0] || null,
      log: s.log.slice(0, 60), cal: {state: 'ok', updated: fmt(Date.now(), false)},
      ntfy: {set: true, last4: 'a1b2'}, ics: {set: true, last4: '.ics'}, lead: 15,
      weather: {override: 'none', simulated: null, note: null, today: [{name: 'umbrella', reason: 'rain 70% at 17:00', on_tray: false}], tomorrow: null,
        location: {name: 'Klagenfurt', latitude: 46.62, longitude: 14.31}, age_minutes: 12,
        now: {temperature_2m: 6.1, apparent_temperature: 3.4, precipitation_probability: 40, precipitation: 0, cloud_cover: 90, uv_index: 0.5},
        range: {from: '09:00', to: '20:00', min_temperature_2m: 5, max_temperature_2m: 9, max_precipitation_probability: 70, max_precipitation: 1.2, max_uv_index: 1}},
    };
  };
  const ok = msg => ({ok: true, msg});
  return {
    async handle(method, path, b) {
      if (path === '/api/state') return state();
      if (path === '/api/presets') {
        if (method === 'GET') return {presets: Object.entries(s.presets).map(([name, p]) => ({name, ...p}))};
        if (method === 'DELETE') { delete s.presets[b.name]; log(`List “${b.name}” deleted`); return ok('List deleted'); }
        const clash = [b.name, ...b.aliases].map(findPreset).find(n => n && n !== b.old_name);
        if (clash) return {ok: false, msg: `Word already used by the list “${clash}”`};
        if (b.old_name && b.old_name !== b.name) delete s.presets[b.old_name];
        s.presets[b.name] = {aliases: b.aliases, items: dedupe(b.items)};
        log(`List “${b.name}” saved`); return ok('List saved');
      }
      if (path === '/api/event_items') {
        const e = s.events.find(x => x.key === b.key);
        if (b.scope === 'event') { s.overrides[b.key] = dedupe(b.items); return ok('List saved for this event only'); }
        if (b.scope === 'reset') { delete s.overrides[b.key]; return ok('Automatic list restored'); }
        let name = findPreset(b.preset);
        if (!name) {
          if (!wordIn(b.preset, e.title)) return {ok: false, msg: `“${b.preset}” is not in the event title`};
          name = b.preset.toLowerCase(); s.presets[name] = {aliases: [], items: []};
        }
        s.presets[name].items = b.items.filter(i => !e.bring.some(p => p.toLowerCase() === i.toLowerCase()));
        delete s.overrides[b.key];
        log(`${e.title}: List “${name}” updated`); return ok(`List “${name}” updated`);
      }
      if (path === '/api/name') { delete s.unnamed[b.uid]; s.tags[b.uid] = b.name; log(`Tag ${b.uid}: ${b.name}`); }
      if (path === '/api/delete') { delete s.tags[b.uid]; log(`Tag ${b.uid} deleted`); }
      if (path === '/api/leave') {
        const st = state();
        if (!st.today) return {problems: [], event: null};
        const evs = st.events.filter(e => st.today.keys.includes(e.key));
        const label = evs.map(e => `${e.title} ${e.when.slice(-5)}`).join(' + ');
        const problems = [...st.today.items.filter(i => i.status === 'missing').map(i => 'missing ' + i.name),
          ...st.today.items.filter(i => i.status === 'unknown').map(i => i.name + ' has no tag')];
        log(problems.length ? `NOTIFY: Don't leave yet (${label}): ` + problems.join('; ') : `Leaving (${label}): all good.`);
        return {problems, event: label};
      }
      if (path === '/api/settings') return ok('Saved (demo)');
      if (path === '/api/demo_time') return ok('Simulated time set (sample data)');
      if (path.startsWith('/api/geocode')) return {ok: true, msg: '', results: [{name: 'Klagenfurt', region: 'Carinthia, Austria', latitude: 46.62, longitude: 14.31},
        {name: 'Villach', region: 'Carinthia, Austria', latitude: 46.61, longitude: 13.85}]};
      if (path === '/api/rules') return method === 'GET' ? {rules: s.rules, override: 'none', vars: ['temperature_2m', 'apparent_temperature',
        'precipitation_probability', 'precipitation', 'cloud_cover', 'uv_index']} : (s.rules = b.rules, ok('Rules saved (demo)'));
      if (path === '/api/test_notify') return ok('Notification sent (demo)');
      return {ok: true};
    },
  };
})();

poll();
setInterval(poll, 1500);
setInterval(() => { prev.status = prev.hero = null; }, 30000);  // refresh "in N min" even when nothing else changes
</script>
